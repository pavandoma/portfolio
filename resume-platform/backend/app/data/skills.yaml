# Skills taxonomy used for job-description parsing, resume parsing and matching.
#
# Fields
#   name      canonical name
#   cat       display group (see `categories` below)
#   aliases   true synonyms / spellings. Matching is case-insensitive unless `cs: true`.
#   parents   broader concepts this skill satisfies. A candidate with PyTorch satisfies a
#             requirement for "Deep Learning Frameworks"; the reverse is NOT true.
#   family    true for narrow grouping concepts whose children are "related but not
#             interchangeable" (PyTorch vs TensorFlow, ECS vs Kubernetes, MySQL vs PostgreSQL).
#   related   extra "related but insufficient" links that are not expressed by a family.
#   cs        aliases are matched case-sensitively (needed for short or ambiguous words).

categories:
  language: Languages
  genai: LLMs & Generative AI
  ml: Machine Learning
  data_eng: Data Engineering
  database: Databases
  cloud: Cloud & DevOps
  analytics: Analytics & Visualization
  business: Business & Process
  marketing: Marketing Analytics
  concept: Concepts
  soft: Professional Skills

